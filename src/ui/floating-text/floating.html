<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>悬浮文本 - 思源文档助手</title>
  <style>
    :root {
      --ft-font-size: 15px;
      --ft-opacity: 0.85;
      --ft-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --ft-bg-color: 255, 255, 255;
      --ft-text-color: #222222;
      --ft-border-color: rgba(0, 0, 0, 0.12);
      --ft-header-bg: rgba(0, 0, 0, 0.05);
      --ft-button-hover: rgba(0, 0, 0, 0.08);
      --ft-code-bg: rgba(0, 0, 0, 0.06);
    }

    [data-theme="dark"] {
      --ft-bg-color: 30, 32, 36;
      --ft-text-color: #e0e0e0;
      --ft-border-color: rgba(255, 255, 255, 0.14);
      --ft-header-bg: rgba(255, 255, 255, 0.06);
      --ft-button-hover: rgba(255, 255, 255, 0.12);
      --ft-code-bg: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: var(--ft-font-family);
      color: var(--ft-text-color);
      user-select: text;
    }

    #ft-app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background: rgba(var(--ft-bg-color), var(--ft-opacity));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--ft-border-color);
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.28);
      transition: background 0.15s ease;
    }

    /* 顶部操作条 */
    .ft-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 36px;
      padding: 0 10px;
      background: var(--ft-header-bg);
      border-bottom: 1px solid var(--ft-border-color);
      user-select: none;
      flex-shrink: 0;
      -webkit-app-region: drag;
    }

    .ft-title-area {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 12px;
      font-weight: 600;
      opacity: 0.9;
    }

    .ft-pin-icon {
      font-size: 13px;
      opacity: 0.85;
    }

    .ft-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    .ft-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 24px;
      padding: 0 6px;
      border: none;
      background: transparent;
      color: var(--ft-text-color);
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0.75;
      transition: opacity 0.15s, background 0.15s;
    }

    .ft-btn:hover {
      opacity: 1;
      background: var(--ft-button-hover);
    }

    .ft-btn.ft-btn-active {
      opacity: 1;
      font-weight: bold;
      background: var(--ft-button-hover);
    }

    /* 快捷抽屉设置条 */
    .ft-drawer {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: var(--ft-header-bg);
      border-bottom: 1px solid var(--ft-border-color);
      font-size: 12px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    .ft-drawer.ft-drawer-open {
      display: flex;
    }

    .ft-drawer-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ft-slider {
      width: 80px;
      cursor: pointer;
      accent-color: #1890ff;
    }

    /* 主内容展示区 */
    .ft-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 14px;
      font-size: var(--ft-font-size);
      line-height: 1.6;
      word-break: break-word;
      -webkit-app-region: no-drag;
    }

    .ft-body::-webkit-scrollbar {
      width: 6px;
    }
    .ft-body::-webkit-scrollbar-thumb {
      background: rgba(128, 128, 128, 0.35);
      border-radius: 3px;
    }
    .ft-body::-webkit-scrollbar-thumb:hover {
      background: rgba(128, 128, 128, 0.6);
    }

    /* 纯文本编辑视图 */
    .ft-text-view {
      white-space: pre-wrap;
      word-break: break-word;
      outline: none;
      min-height: 100%;
      cursor: text;
      caret-color: var(--ft-text-color);
    }

    .ft-text-view:empty::before {
      content: attr(data-placeholder);
      color: rgba(128, 128, 128, 0.55);
      pointer-events: none;
    }

    /* Markdown 视图 */
    .ft-markdown-view {
      display: none;
    }

    .ft-markdown-view h1, .ft-h1 { font-size: 1.4em; font-weight: bold; margin: 0.6em 0 0.3em; }
    .ft-markdown-view h2, .ft-h2 { font-size: 1.25em; font-weight: bold; margin: 0.5em 0 0.3em; }
    .ft-markdown-view h3, .ft-h3 { font-size: 1.1em; font-weight: bold; margin: 0.4em 0 0.2em; }
    .ft-markdown-view p, .ft-p { margin-bottom: 0.5em; }
    .ft-markdown-view strong { font-weight: bold; }
    .ft-markdown-view em { font-style: italic; }
    .ft-markdown-view blockquote, .ft-blockquote {
      border-left: 3px solid rgba(128, 128, 128, 0.5);
      padding-left: 8px;
      margin: 0.5em 0;
      opacity: 0.85;
    }
    .ft-markdown-view ul, .ft-markdown-view ol {
      padding-left: 1.5em;
      margin-bottom: 0.5em;
    }
    .ft-markdown-view li, .ft-list-item {
      margin-left: 1.35em;
      margin-bottom: 0.3em;
      line-height: 1.6;
    }
    .ft-list-item-ordered {
      list-style-type: decimal;
    }
    .ft-code-block {
      background: var(--ft-code-bg);
      border-radius: 4px;
      padding: 8px 10px;
      margin: 0.5em 0;
      font-family: monospace;
      font-size: 0.9em;
      overflow-x: auto;
    }
    .ft-inline-code {
      background: var(--ft-code-bg);
      padding: 1px 4px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 0.9em;
    }
    .ft-todo-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 0.25em;
      margin-bottom: 0.35em;
    }
    .ft-blank-line {
      height: 0.8em;
    }

    /* 快捷提示浮条 */
    .ft-toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 11px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 100;
    }
    .ft-toast.ft-toast-show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="ft-app">
    <header class="ft-header">
      <div class="ft-title-area" id="ft-title-area" title="悬浮文本">
        <span class="ft-pin-icon">📌</span>
        <span id="ft-title-text">悬浮文本</span>
      </div>
      <div class="ft-actions">
        <button id="ft-btn-view" class="ft-btn" title="切换纯文本 / Markdown 预览">纯文本</button>
        <button id="ft-btn-copy" class="ft-btn" title="复制文本">复制</button>
        <button id="ft-btn-settings" class="ft-btn" title="悬浮设置">⚙️</button>
        <button id="ft-btn-close" class="ft-btn" title="关闭 (Esc)">✕</button>
      </div>
    </header>

    <div id="ft-drawer" class="ft-drawer">
      <div class="ft-drawer-group">
        <span>透明度</span>
        <input type="range" id="ft-opacity-slider" class="ft-slider" min="10" max="100" value="85" />
        <span id="ft-opacity-label">85%</span>
      </div>
      <div class="ft-drawer-group">
        <span>字号</span>
        <button id="ft-font-dec" class="ft-btn" title="缩小字号 (Ctrl+滚轮下)">A-</button>
        <span id="ft-font-label">15px</span>
        <button id="ft-font-inc" class="ft-btn" title="放大字号 (Ctrl+滚轮上)">A+</button>
      </div>
    </div>

    <main class="ft-body" id="ft-scroll-body">
      <div id="ft-text-view" class="ft-text-view" contenteditable="plaintext-only" spellcheck="false" data-placeholder="在此处编辑文本..."></div>
      <div id="ft-markdown-view" class="ft-markdown-view"></div>
    </main>

    <div id="ft-toast" class="ft-toast">已复制</div>
  </div>

  <script>
    (function () {
      const STORAGE_CONFIG_KEY = "doc-assistant.floating-text.config";
      const STORAGE_PAYLOAD_KEY = "doc-assistant-floating-payload";

      function escapeHtml(text) {
        return (text || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function renderInline(text) {
        let esc = escapeHtml(text);
        esc = esc.replace(/`([^`]+)`/g, '<code class="ft-inline-code">$1</code>');
        esc = esc.replace(/\\*\\*([^*]+)\\*\\*/g, '<strong>$1</strong>');
        esc = esc.replace(/\\*([^*]+)\\*/g, '<em>$1</em>');
        esc = esc.replace(/~~([^~]+)~~/g, '<del>$1</del>');
        esc = esc.replace(/\\[([^\\]]+)\\]\\(([^)]+)\\)/g, '<a href="$2" target="_blank">$1</a>');
        return esc;
      }

      function simpleMarkdownToHtml(md) {
        if (!md) return "";
        const lines = md.split(/\\r?\\n/);
        const parts = [];
        let inCode = false;
        let codeLines = [];

        for (const line of lines) {
          if (line.trim().startsWith("```")) {
            if (!inCode) {
              inCode = true;
              codeLines = [];
            } else {
              inCode = false;
              parts.push('<pre class="ft-code-block"><code>' + escapeHtml(codeLines.join("\\n")) + '</code></pre>');
            }
            continue;
          }
          if (inCode) {
            codeLines.push(line);
            continue;
          }
          const trimmed = line.trim();
          if (!trimmed) {
            parts.push('<div class="ft-blank-line"></div>');
            continue;
          }
          const hMatch = trimmed.match(/^(#{1,6})\\s+(.*)$/);
          if (hMatch) {
            const level = hMatch[1].length;
            parts.push('<h' + level + ' class="ft-h' + level + '">' + renderInline(hMatch[2]) + '</h' + level + '>');
            continue;
          }
          const todoMatch = trimmed.match(/^-\\s+\\[([ xX])\\]\\s+(.*)$/);
          if (todoMatch) {
            const checked = todoMatch[1].toLowerCase() === "x";
            parts.push('<div class="ft-todo-item"><input type="checkbox" disabled ' + (checked ? 'checked' : '') + '/> <span>' + renderInline(todoMatch[2]) + '</span></div>');
            continue;
          }
          const listMatch = trimmed.match(/^[-*+]\s+(.*)$/);
          if (listMatch) {
            parts.push('<li class="ft-list-item">' + renderInline(listMatch[1]) + '</li>');
            continue;
          }
          const oListMatch = trimmed.match(/^\d+\.\s+(.*)$/);
          if (oListMatch) {
            parts.push('<li class="ft-list-item ft-list-item-ordered">' + renderInline(oListMatch[1]) + '</li>');
            continue;
          }
          if (trimmed.startsWith(">")) {
            parts.push('<blockquote class="ft-blockquote">' + renderInline(trimmed.replace(/^>\\s*/, "")) + '</blockquote>');
            continue;
          }
          parts.push('<p class="ft-p">' + renderInline(line) + '</p>');
        }
        if (inCode && codeLines.length) {
          parts.push('<pre class="ft-code-block"><code>' + escapeHtml(codeLines.join("\\n")) + '</code></pre>');
        }
        return parts.join("\\n");
      }

      function loadConfig() {
        try {
          const raw = localStorage.getItem(STORAGE_CONFIG_KEY);
          if (raw) return JSON.parse(raw);
        } catch (e) {}
        return {
          opacity: 0.85,
          fontSize: 15,
          viewMode: "text",
          themeMode: "auto",
          rememberSize: true,
        };
      }

      function saveConfig(patch) {
        const cur = loadConfig();
        const next = Object.assign({}, cur, patch);
        try {
          localStorage.setItem(STORAGE_CONFIG_KEY, JSON.stringify(next));
        } catch (e) {}
        return next;
      }

      function loadPayload() {
        try {
          const raw = localStorage.getItem(STORAGE_PAYLOAD_KEY);
          if (raw) return JSON.parse(raw);
        } catch (e) {}
        return { title: "悬浮文本", text: "" };
      }

      const appEl = document.getElementById("ft-app");
      const titleArea = document.getElementById("ft-title-area");
      const titleText = document.getElementById("ft-title-text");
      const textView = document.getElementById("ft-text-view");
      const mdView = document.getElementById("ft-markdown-view");
      const viewBtn = document.getElementById("ft-btn-view");
      const copyBtn = document.getElementById("ft-btn-copy");
      const settingsBtn = document.getElementById("ft-btn-settings");
      const closeBtn = document.getElementById("ft-btn-close");
      const drawer = document.getElementById("ft-drawer");
      const slider = document.getElementById("ft-opacity-slider");
      const opacityLabel = document.getElementById("ft-opacity-label");
      const fontLabel = document.getElementById("ft-font-label");
      const fontIncBtn = document.getElementById("ft-font-inc");
      const fontDecBtn = document.getElementById("ft-font-dec");
      const toast = document.getElementById("ft-toast");

      let config = loadConfig();
      let payload = loadPayload();

      function applyTheme() {
        if (config.themeMode === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        } else if (config.themeMode === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        } else {
          // auto: detect system or opener
          const isSysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", isSysDark ? "dark" : "light");
        }
      }

      function applyConfig() {
        applyTheme();
        appEl.style.setProperty("--ft-opacity", String(config.opacity));
        appEl.style.setProperty("--ft-font-size", config.fontSize + "px");
        slider.value = String(Math.round(config.opacity * 100));
        opacityLabel.textContent = Math.round(config.opacity * 100) + "%";
        fontLabel.textContent = config.fontSize + "px";

        if (config.viewMode === "markdown") {
          viewBtn.textContent = "MD";
          textView.style.display = "none";
          mdView.style.display = "block";
        } else {
          viewBtn.textContent = "纯文本";
          textView.style.display = "block";
          mdView.style.display = "none";
        }
      }

      function applyPayload() {
        document.title = payload.title || "悬浮文本";
        titleArea.title = payload.title || "悬浮文本";
        titleText.textContent = payload.title || "悬浮文本";
        textView.textContent = payload.text || "";
        mdView.innerHTML = simpleMarkdownToHtml(payload.text || "");
      }

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("ft-toast-show");
        setTimeout(function () {
          toast.classList.remove("ft-toast-show");
        }, 1500);
      }

      function updateFontSize(nextSize) {
        nextSize = Math.max(11, Math.min(42, nextSize));
        config.fontSize = nextSize;
        appEl.style.setProperty("--ft-font-size", nextSize + "px");
        fontLabel.textContent = nextSize + "px";
        saveConfig({ fontSize: nextSize });
      }

      function updateOpacity(op) {
        config.opacity = op;
        appEl.style.setProperty("--ft-opacity", String(op));
        opacityLabel.textContent = Math.round(op * 100) + "%";
        saveConfig({ opacity: op });
      }

      function getSelectedText() {
        try {
          var sel = window.getSelection ? window.getSelection() : null;
          if (!sel || sel.rangeCount === 0 || sel.isCollapsed) {
            return "";
          }
          return sel.toString();
        } catch (e) {
          return "";
        }
      }

      // 绑定事件
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          window.close();
          return;
        }
        if ((e.ctrlKey || e.metaKey) && (e.key === "c" || e.key === "C")) {
          var selected = getSelectedText();
          if (selected && selected.trim().length > 0) {
            e.preventDefault();
            copyText(selected).then(function (ok) {
              if (ok) {
                showToast("已复制选中内容");
              }
            });
          }
        }
      });

      document.addEventListener("wheel", function (e) {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
          const dir = e.deltaY < 0 ? 1 : -1;
          updateFontSize(config.fontSize + dir);
        }
      }, { passive: false });

      closeBtn.addEventListener("click", function () {
        window.close();
      });

      function fallbackExecCopy(str) {
        try {
          var ta = document.createElement("textarea");
          ta.value = str;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          ta.style.top = "0";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          var ok = document.execCommand("copy");
          document.body.removeChild(ta);
          return Boolean(ok);
        } catch (err) {
          return false;
        }
      }

      function copyText(str) {
        var electronClipboard = null;
        try {
          var electron = window.require ? window.require("electron") : null;
          var remote = (window.require && window.require("@electron/remote")) || (electron && electron.remote);
          if (electron && electron.clipboard) {
            electronClipboard = electron.clipboard;
          } else if (remote && remote.clipboard) {
            electronClipboard = remote.clipboard;
          }
        } catch (e) {}

        if (electronClipboard && typeof electronClipboard.writeText === "function") {
          try {
            electronClipboard.writeText(str);
            return Promise.resolve(true);
          } catch (e) {}
        }

        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          return navigator.clipboard.writeText(str).then(function () {
            return true;
          }).catch(function () {
            return fallbackExecCopy(str);
          });
        }

        return Promise.resolve(fallbackExecCopy(str));
      }

      function getCurrentText() {
        if (!textView) return "";
        return textView.innerText || textView.textContent || "";
      }

      textView.addEventListener("paste", function (e) {
        e.preventDefault();
        var clipText = (e.clipboardData || window.clipboardData)?.getData("text/plain") || "";
        if (document.queryCommandSupported && document.queryCommandSupported("insertText")) {
          document.execCommand("insertText", false, clipText);
        } else {
          var sel = window.getSelection ? window.getSelection() : null;
          if (sel && sel.rangeCount > 0) {
            var range = sel.getRangeAt(0);
            range.deleteContents();
            range.insertNode(document.createTextNode(clipText));
            range.collapse(false);
          }
        }
      });

      copyBtn.addEventListener("mousedown", function (e) {
        e.preventDefault();
      });

      copyBtn.addEventListener("click", function () {
        var selected = getSelectedText();
        var hasSelection = Boolean(selected && selected.trim().length > 0);
        var target = hasSelection ? selected : getCurrentText();

        copyText(target).then(function (ok) {
          if (ok) {
            showToast(hasSelection ? "已复制选中内容" : "已复制全部内容");
          } else {
            showToast("复制失败");
          }
        });
      });

      viewBtn.addEventListener("click", function () {
        config.viewMode = config.viewMode === "text" ? "markdown" : "text";
        saveConfig({ viewMode: config.viewMode });
        applyConfig();
        if (config.viewMode === "markdown") {
          mdView.innerHTML = simpleMarkdownToHtml(getCurrentText());
        } else {
          textView.focus();
        }
      });

      settingsBtn.addEventListener("click", function () {
        drawer.classList.toggle("ft-drawer-open");
        settingsBtn.classList.toggle("ft-btn-active");
      });

      slider.addEventListener("input", function () {
        const val = parseInt(slider.value, 10);
        const op = val / 100;
        appEl.style.setProperty("--ft-opacity", String(op));
        opacityLabel.textContent = val + "%";
      });

      slider.addEventListener("change", function () {
        const val = parseInt(slider.value, 10);
        updateOpacity(val / 100);
      });

      fontIncBtn.addEventListener("click", function () {
        updateFontSize(config.fontSize + 1);
      });

      fontDecBtn.addEventListener("click", function () {
        updateFontSize(config.fontSize - 1);
      });

      // 窗口尺寸记忆
      let resizeTimer = null;
      window.addEventListener("resize", function () {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          saveConfig({
            width: window.innerWidth,
            height: window.innerHeight,
          });
        }, 400);
      });

      // 监听外部数据更新
      window.addEventListener("storage", function (e) {
        if (e.key === STORAGE_PAYLOAD_KEY) {
          payload = loadPayload();
          applyPayload();
        }
      });

      // 初始化
      applyConfig();
      applyPayload();
    })();
  </script>
</body>
</html>
